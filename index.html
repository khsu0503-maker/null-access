
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NULL ACCESS</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: #00ff66;
  font-family: monospace;
  overflow: hidden;
}

#screen {
  padding: 20px;
  height: 100vh;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-all;
}

.red { color: #ff2222; }
.white { color: white; }
.dim { color: #087d39; }

#warning {
  display: none;
  position: fixed;
  inset: 0;
  background: black;
  color: red;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  font-size: 25px;
  z-index: 5;
  animation: flash 0.4s infinite alternate;
}

@keyframes flash {
  from { background: #000; }
  to { background: #200000; }
}
</style>
</head>

<body>
<div id="screen">
  <div class="white">NULL ACCESS SYSTEM v4.09</div>
  <div class="dim">Initializing terminal...</div>
  <br>
  <div id="logs"></div>
</div>

<div id="warning">
  <div>ACCESS DENIED</div>
  <br>
  <div style="font-size:15px">YOU WERE NEVER ALONE.</div>
</div>

<script>
const logs = document.getElementById("logs");
const screen = document.getElementById("screen");
const warning = document.getElementById("warning");

let count = 0;

const messages = [
  "Connecting to remote node...",
  "Scanning virtual network...",
  "0x7FA2C901",
  "Analyzing fictional data...",
  "Searching unknown directory...",
  "USER: UNKNOWN",
  "DEVICE: UNIDENTIFIED",
  "WARNING: UNEXPECTED RESPONSE",
  "ACCESSING NULL DIRECTORY...",
  "CONNECTION STATUS: UNSTABLE"
];

const timer = setInterval(() => {
  const line = document.createElement("div");

  if (count % 7 === 0) {
    line.className = "red";
    line.textContent = "[WARNING] " + messages[count % messages.length];
  } else {
    line.textContent =
      messages[count % messages.length] +
      " 0x" + Math.floor(Math.random() * 16777215)
        .toString(16).toUpperCase();
  }

  logs.appendChild(line);
  screen.scrollTop = screen.scrollHeight;
  count++;

  if (count >= 55) {
    clearInterval(timer);

    setTimeout(() => {
      logs.innerHTML = `
        <div class="red">WHO ARE YOU?</div>
        <br>
        <div class="white">I CAN SEE YOU.</div>
      `;

      setTimeout(() => {
        warning.style.display = "flex";

        setTimeout(() => {
          document.body.innerHTML = "";
          document.body.style.background = "black";
        }, 3500);

      }, 2500);

    }, 1500);
  }
}, 180);

</script>
</body>
</html>
